name: Update fxSAVE/fxUSD dashboard

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}      # boton manual "Run workflow" en GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: python fetch_fx_pools.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "fx-pools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "auto-update: fxSAVE/fxUSD data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
